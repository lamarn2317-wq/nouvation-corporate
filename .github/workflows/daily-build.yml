name: Daily Build for Market Data

on:
  schedule:
    # 毎日 午前5:00 (日本時間) に実行
    # UTC（世界標準時）で指定するため 20:00 に設定
    - cron: '0 20 * * *'
  workflow_dispatch: # 手動で実行したい時用

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
